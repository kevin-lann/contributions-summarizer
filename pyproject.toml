[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contributions-summarizer"
version = "0.1.0"
description = "Summarize a user's GitHub pull request contributions to a repository."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
contrib-summary = "contributions_summarizer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
